services:
  - type: web
    name: aerovision-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AEROVISION_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'
    disk:
      name: aerovision-uploads
      mountPath: /app/uploads
      sizeGB: 5

