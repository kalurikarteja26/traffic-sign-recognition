<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Border with Gradient Glow -->
  <path d="M32 4L10 12V28C10 43 19.5 54.5 32 60C44.5 54.5 54 43 54 28V12L32 4Z" 
        fill="url(#innerGlow)" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" />

  <!-- Road / Horizon Chevrons -->
  <path d="M22 40L32 26L42 40" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M26 46L32 37L38 46" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Center Telemetry Reticle Dot -->
  <circle cx="32" cy="20" r="3.5" fill="#10B981" filter="url(#glow)"/>
  <circle cx="32" cy="20" r="1.5" fill="#FFFFFF"/>
</svg>